<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f3028" />
    <title>Mushaf Companion — Offline</title>
    <style>
      *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0f3028;color:#f7eddc;font-family:Georgia,serif;padding:28px;text-align:center}.card{max-width:420px}.mark{width:88px;height:88px;margin:0 auto 24px}.mark img{width:100%;height:100%;display:block}h1{font-weight:400;font-size:2rem;margin:0 0 12px}p{font:15px/1.65 system-ui,sans-serif;color:rgba(247,237,220,.72);margin:0 0 24px}button{border:1px solid #d1ad72;border-radius:999px;background:#f7eddc;color:#0f3028;padding:12px 20px;font:600 14px system-ui,sans-serif;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark"><img src="/icon.svg" alt="" /></div>
      <h1>You’re offline</h1>
      <p>Mushaf Companion needs a connection to verify Quran page data and stream recitation. Your bookmarks and reading preferences remain saved on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
