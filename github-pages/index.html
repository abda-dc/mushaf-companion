<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f3028" />
    <meta name="description" content="A calm, page-faithful Quran reader with all 604 Madani mushaf pages, tajweed guidance, transliteration, bookmarks, search, and recitation." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mushaf" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Mushaf Companion</title>
    <style>
      :root{color-scheme:dark;--green:#0f3028;--paper:#f7eddc;--gold:#d1ad72}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--green)}body{font-family:system-ui,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--green)}.loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 42%,#194b3f 0,var(--green) 58%);color:var(--paper);text-align:center;transition:opacity .3s ease,visibility .3s ease}.loading[hidden]{display:none}.mark{display:block;width:92px;height:92px;margin:0 auto 22px;filter:drop-shadow(0 14px 32px rgba(0,0,0,.25))}h1{margin:0 0 8px;font:400 clamp(30px,7vw,46px)/1.1 Georgia,serif}p{max-width:360px;margin:0;color:rgba(247,237,220,.7);font-size:14px;line-height:1.6}.actions{display:flex;justify-content:center;gap:10px;margin-top:24px}.actions a,.install{border:1px solid rgba(209,173,114,.7);border-radius:999px;padding:11px 17px;color:var(--paper);background:rgba(0,0,0,.12);font:600 13px system-ui,sans-serif;text-decoration:none;cursor:pointer}.install{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:3;background:var(--paper);color:var(--green);box-shadow:0 10px 30px rgba(0,0,0,.25)}
    </style>
  </head>
  <body>
    <div class="loading" id="loading" role="status">
      <div>
        <img class="mark" src="./icon.svg" alt="" />
        <h1>Mushaf Companion</h1>
        <p>The mushaf, faithfully reimagined. Loading the verified 604-page reader…</p>
        <div class="actions"><a href="https://mushaf-companion.abda-dc.chatgpt.site/" target="_blank" rel="noopener">Open directly</a></div>
      </div>
    </div>
    <iframe id="reader" src="https://mushaf-companion.abda-dc.chatgpt.site/" title="Mushaf Companion Quran reader" allow="autoplay; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <button class="install" id="install" type="button" hidden>Install app</button>
    <noscript><p>This app requires JavaScript. <a href="https://mushaf-companion.abda-dc.chatgpt.site/">Open the reader directly.</a></p></noscript>
    <script>
      const loading = document.getElementById("loading");
      const reader = document.getElementById("reader");
      const install = document.getElementById("install");
      let installPrompt;

      reader.addEventListener("load", () => { loading.hidden = true; });
      window.setTimeout(() => { loading.querySelector("p").textContent = "The reader is taking longer than expected. You can open it directly while it connects."; }, 8000);

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;
        install.hidden = false;
      });
      install.addEventListener("click", async () => {
        if (!installPrompt) return;
        await installPrompt.prompt();
        installPrompt = undefined;
        install.hidden = true;
      });
      window.addEventListener("appinstalled", () => { install.hidden = true; });
      if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    </script>
  </body>
</html>
